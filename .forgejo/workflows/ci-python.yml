# Forgejo-Variante von .github/workflows/ci-python.yml (#213). Gleiche Struktur wie GHA (Orchestrator +
# workflow_call). Abweichungen zu GHA: upload-artifact@v3 (nicht blockierend, TLS), kein type=gha
# Cache, buf breaking gegen lokales origin/main.
name: CI — Python SDK

on:
  workflow_call:

jobs:
  python-ci:
    name: Python SDK — Lint, Test, Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint + format (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Tests
        run: pytest --tb=short -q

      - name: Security (pip-audit)
        run: |
          pip install pip-audit
          pip-audit
