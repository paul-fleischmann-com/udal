# Forgejo-Variante von .github/workflows/ci-deploy.yml (#208). Eigenstaendiger Workflow: Forgejo
# unterstuetzt kein workflow_call, daher kein Orchestrator -- der Pfadfilter laeuft
# als Job `changes` (Composite Action changed-paths), nicht betroffene Jobs werden
# uebersprungen statt den Workflow gar nicht zu starten (Required Checks!). Abweichungen zu GHA: upload-artifact@v3, kein type=gha Cache,
# buf breaking gegen lokales origin/main, push-Trigger.
name: CI — Deploy (Docker, Compose, Helm)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Geaenderte Pfade
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            code/gateway/**
            deployments/docker/**
            deployments/helm/**
            Dockerfile
            examples/**
            .forgejo/workflows/ci-deploy.yml

  docker-build:
    name: Docker — Build Gateway Image
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          load: true
          tags: udal-gateway:ci

      - name: Check image size (≤ 30 MB)
        run: |
          SIZE=$(docker image inspect udal-gateway:ci --format='{{.Size}}')
          LIMIT=$((30 * 1024 * 1024))
          echo "Image size: $((SIZE / 1024 / 1024)) MB (limit: 30 MB)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: Docker image exceeds 30 MB limit"
            exit 1
          fi

  demo-compose:
    name: Demo — Docker Compose build + verify
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    # Bewusst ohne `needs` auf den Go-Workflow (issue #30 PR review): sonst
    # wuerde der Job still uebersprungen, sobald der Go-Teil nicht laeuft.
    # Das Gateway-Image wird hier per `compose up --build` selbst gebaut.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker compose v2 + curl + jq are all preinstalled on this runner
      # image -- no setup steps needed. TEAR_DOWN=1 so the stack doesn't
      # linger past this job.
      - name: Build, start, and verify the demonstrator stack
        run: TEAR_DOWN=1 bash examples/verify-demo.sh

  helm-lint:
    name: Helm — lint udal-gateway chart
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: helm lint
        run: |
          helm lint deployments/helm/udal-gateway \
            --set gateway.apiKey="ci:admin:ci-secret"
