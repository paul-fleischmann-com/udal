# TEMPORAER (#213): Diagnose, ob Forgejo workflow_call unterstuetzt. Nach dem Test entfernen.
name: Diag Callee

on:
  workflow_call:
    inputs:
      flag:
        type: boolean
        default: true

jobs:
  callee-job:
    name: Callee Job
    runs-on: ubuntu-latest
    steps:
      - run: echo "callee laeuft, input flag=${{ inputs.flag }}"
