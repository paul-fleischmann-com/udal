# Forgejo-Variante von .github/workflows/ci-repo.yml (#208). Eigenstaendiger Workflow: Forgejo
# unterstuetzt kein workflow_call, daher kein Orchestrator -- der Pfadfilter laeuft
# als Job `changes` (Composite Action changed-paths), nicht betroffene Jobs werden
# uebersprungen statt den Workflow gar nicht zu starten (Required Checks!). Abweichungen zu GHA: upload-artifact@v3, kein type=gha Cache,
# buf breaking gegen lokales origin/main, push-Trigger.
name: CI — Repo (SPDX, Architektur)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Geaenderte Pfade
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            architecture.jsonc
            code/**/*.go
            code/**/*.rs
            code/**/*.py
            code/**/*.ts
            scripts/add-spdx-headers.py
            .forgejo/workflows/ci-repo.yml

  # Schlaegt fehl, wenn einer Quelldatei der SPDX-Header fehlt. Das fruehere
  # Auto-Commit auf main (push) entfaellt: Dieser Workflow laeuft nur noch bei
  # pull_request (Entwicklung/volle CI laeuft auf Forgejo).
  spdx-check:
    name: SPDX — Header check
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add missing SPDX headers
        run: python3 scripts/add-spdx-headers.py

      - name: Commit added headers (main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.git.local"
          git diff --quiet && echo "No missing headers." || \
            (git commit -am "chore - add missing SPDX headers [skip ci]" && git push)

      - name: Verify all headers present
        run: python3 scripts/add-spdx-headers.py --check

  architecture-validate:
    name: Architecture — Validate Bausteinsicht model
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache: "false"

      - name: Install bausteinsicht
        run: go install github.com/docToolchain/Bausteinsicht/cmd/bausteinsicht@latest

      - name: Validate architecture model
        run: bausteinsicht validate --model architecture.jsonc
