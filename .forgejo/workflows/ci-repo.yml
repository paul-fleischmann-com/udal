# Forgejo-Variante von .github/workflows/ci-repo.yml (#213). Gleiche Struktur wie GHA (Orchestrator +
# workflow_call). Abweichungen zu GHA: upload-artifact@v3 (nicht blockierend, TLS), kein type=gha
# Cache, buf breaking gegen lokales origin/main.
name: CI — Repo (SPDX, Architektur)

on:
  workflow_call:
    inputs:
      spdx:
        type: boolean
        default: true
      architecture:
        type: boolean
        default: true

jobs:
  # Schlaegt fehl, wenn einer Quelldatei der SPDX-Header fehlt (kein Auto-Commit,
  # kein Schreibrecht noetig, #218). Beheben: python3 scripts/add-spdx-headers.py.
  spdx-check:
    name: SPDX — Header check
    if: inputs.spdx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all SPDX headers present
        run: |
          python3 scripts/add-spdx-headers.py --check || {
            echo "::error::Fehlende SPDX-Header. Lokal 'python3 scripts/add-spdx-headers.py' ausfuehren und die Aenderungen committen."
            exit 1
          }

  architecture-validate:
    name: Architecture — Validate Bausteinsicht model
    if: inputs.architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache: "false"

      - name: Install bausteinsicht
        run: go install github.com/docToolchain/Bausteinsicht/cmd/bausteinsicht@latest

      - name: Validate architecture model
        run: bausteinsicht validate --model architecture.jsonc
