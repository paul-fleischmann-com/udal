# Minimal Mosquitto config for the docker-compose demonstrator stack
# (issue #30) — anonymous, unencrypted, no persistence. Not for production
# use; the gateway's own auth (X-API-Key / mTLS) is the actual trust
# boundary here, MQTT is just the local transport between the broker and
# devices/gateway inside the compose network.
listener 1883
allow_anonymous true
persistence false
