name: CI

# Entwicklung und volle CI laufen auf Forgejo (.forgejo/workflows/ci.yml).
# Hier nur noch Checks fuer externe PRs und manuelle Laeufe.
#
# Orchestrator (Variante D, #208): erkennt geaenderte Pfade und ruft pro Gruppe
# einen eigenen wiederverwendbaren Workflow (ci-<gruppe>.yml) auf. Der
# `CI Gate`-Job unten bleibt der einzige Required Check -- so haengen
# pfadgefilterte Gruppen nicht als "pending", wenn sie uebersprungen werden.
# Der Load/Soak-Test liegt in ci-nightly.yml (schedule + workflow_dispatch).
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Change Detection ─────────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go:           ${{ steps.filter.outputs.go }}
      rust:         ${{ steps.filter.outputs.rust }}
      python:       ${{ steps.filter.outputs.python }}
      typescript:   ${{ steps.filter.outputs.typescript }}
      reflex:       ${{ steps.filter.outputs.reflex }}
      proto:        ${{ steps.filter.outputs.proto }}
      docker:       ${{ steps.filter.outputs.docker }}
      architecture: ${{ steps.filter.outputs.architecture }}
      schema:       ${{ steps.filter.outputs.schema }}
      helm:         ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'code/gateway/**'
              - 'code/adapters/**'
              - 'code/cli/**'
              - 'code/sdk/go/**'
              - 'go.work'
              - 'go.mod'
              - 'go.sum'
              - '.goreleaser.yaml'
            rust:
              - 'code/sdk/rust/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
            python:
              - 'code/sdk/python/**'
              - '**/pyproject.toml'
              - '**/requirements*.txt'
            typescript:
              - 'code/sdk/typescript/**'
              - '**/package.json'
              - '**/tsconfig.json'
            reflex:
              - 'dashboard/**'
              - 'code/sdk/python/**'
            proto:
              - 'code/api/proto/**'
              - 'code/api/openapi/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'redocly.yaml'
            docker:
              - 'code/gateway/**'
              - 'deployments/docker/**'
              - 'Dockerfile'
              - 'examples/**'
            architecture:
              - 'architecture.jsonc'
            schema:
              - 'schema/**'
            helm:
              - 'deployments/helm/**'
            spdx:
              - 'code/**/*.go'
              - 'code/**/*.rs'
              - 'code/**/*.py'
              - 'code/**/*.ts'
              - 'scripts/add-spdx-headers.py'

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-go.yml

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-rust.yml

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-python.yml

  typescript:
    name: typescript
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-typescript.yml

  reflex:
    name: reflex
    needs: changes
    if: needs.changes.outputs.reflex == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-reflex.yml

  proto-schema:
    name: proto-schema
    needs: changes
    if: needs.changes.outputs.proto == 'true' || needs.changes.outputs.schema == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-proto-schema.yml
    with:
      proto: ${{ needs.changes.outputs.proto == 'true' || github.ref == 'refs/heads/main' }}
      schema: ${{ needs.changes.outputs.schema == 'true' || github.ref == 'refs/heads/main' }}

  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.helm == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-deploy.yml
    with:
      docker: ${{ needs.changes.outputs.docker == 'true' || github.ref == 'refs/heads/main' }}
      helm: ${{ needs.changes.outputs.helm == 'true' || github.ref == 'refs/heads/main' }}

  repo:
    name: repo
    needs: changes
    if: needs.changes.outputs.spdx == 'true' || needs.changes.outputs.architecture == 'true' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-repo.yml
    with:
      spdx: ${{ needs.changes.outputs.spdx == 'true' || github.ref == 'refs/heads/main' }}
      architecture: ${{ needs.changes.outputs.architecture == 'true' || github.ref == 'refs/heads/main' }}

# ─── Summary Gate ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (all checks passed)
    needs: [go, rust, python, typescript, reflex, proto-schema, deploy, repo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [
            name for name, data in needs.items()
            if data['result'] not in ('success', 'skipped')
          ]
          if failed:
            print('FAILED jobs:', ', '.join(failed))
            sys.exit(1)
          print('All jobs passed or were skipped.')
          "
