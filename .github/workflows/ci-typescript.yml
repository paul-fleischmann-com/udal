name: CI — TypeScript SDK

on:
  workflow_call:

jobs:
  typescript-ci:
    name: TypeScript SDK — Lint, Test, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high
