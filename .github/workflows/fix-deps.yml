name: Fix vulnerable dependencies

# One-shot workflow — trigger manually, then delete after the fix PR is merged.
# Fixes: grpc v1.83.1, otel v1.45.0 (Go); rustls v0.23.45 (Rust); npm audit (TS SDK)
# Tracked in issue #134

on:
  workflow_dispatch:

jobs:
  fix-go:
    name: Bump Go dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Bump grpc + otel in gateway
        working-directory: code/gateway
        run: |
          go get google.golang.org/grpc@v1.83.1
          go get go.opentelemetry.io/otel/sdk@v1.45.0
          go get go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
          go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
          go mod tidy

      - name: Bump grpc in sdk/go
        working-directory: code/sdk/go
        run: |
          go get google.golang.org/grpc@v1.83.1
          go mod tidy

      - name: Bump grpc in cli
        working-directory: code/cli
        run: |
          go get google.golang.org/grpc@v1.83.1
          go mod tidy

      - name: Bump grpc in api/proto/gen
        working-directory: code/api/proto/gen
        run: |
          go get google.golang.org/grpc@v1.83.1 || true
          go mod tidy

      - name: Create PR for Go fixes
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fix-go-deps
          commit-message: "#134 - chore - bump grpc to v1.83.1 and otel to v1.45.0"
          title: "#134 - chore - bump grpc v1.83.1 + otel v1.45.0 across all Go modules"
          body: |
            Fixes Dependabot alerts for `google.golang.org/grpc` and
            `go.opentelemetry.io/otel/*` across all four Go modules.

            Closes alerts: #56 #55 #54 #53 #52 #51 #50 #49 #48 #47 #46 #45
                           #33 #32 #31 #30 #12 #8 #3 #62 #61 #60

            Part of #134

  fix-rust:
    name: Bump Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Update rustls
        working-directory: code/sdk/rust
        run: cargo update rustls --precise 0.23.45

      - name: Create PR for Rust fixes
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fix-rust-deps
          commit-message: "#134 - chore - update rustls to 0.23.45"
          title: "#134 - chore - update rustls to 0.23.45"
          body: |
            Updates transitive dependency `rustls` to 0.23.45 via `cargo update`.

            Closes alert: #70

            Part of #134

  fix-npm:
    name: Fix npm vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit fix (TypeScript SDK)
        working-directory: code/sdk/typescript
        run: |
          npm ci
          npx npm@latest audit fix --force

      - name: Create PR for npm fixes
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fix-npm-deps
          commit-message: "#134 - chore - npm audit fix in TypeScript SDK"
          title: "#134 - chore - npm audit fix in TypeScript SDK"
          body: |
            Runs `npm audit fix --force` in `code/sdk/typescript` to resolve
            high/moderate vulnerabilities in transitive dependencies.

            Part of #134
