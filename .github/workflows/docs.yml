name: Docs

on:
  push:
    branches: [main]
    # paths filter does not apply to tag pushes, so the PDF is always built
    # on a version tag regardless of which files changed.
    tags:
      - "v*.*.*"
    paths:
      - "docs/**"
      - "architecture.jsonc"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "architecture.jsonc"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build arc42 PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload to a release

    steps:
      - uses: actions/checkout@v4

      # ── 1. Install bausteinsicht (already used in CI for validation) ───────────
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Install bausteinsicht
        run: go install github.com/docToolchain/Bausteinsicht/cmd/bausteinsicht@latest

      # ── 2. Convert Mermaid sources to PNG via mermaid-cli ─────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Write Puppeteer config (no-sandbox for CI)
        run: |
          cat > /tmp/puppeteer.json <<'EOF'
          {"args": ["--no-sandbox", "--disable-setuid-sandbox"]}
          EOF

      # ── 3. Generate all architecture diagrams ────────────────────────────────
      # bausteinsicht discovers every view from the model itself (--view
      # defaults to "all"), so no hardcoded lists are needed here.
      # Adding a new view to architecture.jsonc is enough.
      - name: Generate architecture diagrams
        run: |
          mkdir -p docs/images

          # Export all static views and all sequence diagrams as Mermaid source
          bausteinsicht export-diagram \
            --model architecture.jsonc \
            --diagram-format mermaid \
            --output docs/images/

          bausteinsicht export-sequence \
            --model architecture.jsonc \
            --diagram-format mermaid \
            --output docs/images/

          # Convert every exported file → PNG with arch- prefix.
          # export-diagram writes <view>.mmd; export-sequence writes sequence-<view>.md.
          # mmdc only processes .mmd — rename .md files before passing them in.
          for f in docs/images/*.mmd docs/images/*.md; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            view="${base#sequence-}"   # strip sequence- prefix (no-op for static views)
            view="${view%.*}"          # strip .mmd / .md extension

            # ensure mmdc sees a .mmd extension
            input="$f"
            if [[ "$f" == *.md ]]; then
              input="docs/images/${view}.mmd"
              mv "$f" "$input"
            fi

            mmdc \
              --input  "$input" \
              --output "docs/images/arch-${view}.png" \
              --puppeteerConfigFile /tmp/puppeteer.json \
              --theme neutral \
              --width 1400
            rm "$input"
          done

      # ── 4. Generate element tables for static views ──────────────────────────
      # export-table produces one AsciiDoc table per view; arc42.adoc
      # includes them via include::generated/<view>.adoc[].
      # Sequence/dynamic views are skipped — tables add no value there.
      - name: Generate element tables
        run: |
          mkdir -p docs/arc42/generated
          bausteinsicht export-table \
            --model architecture.jsonc \
            --table-format adoc \
            --output docs/arc42/generated/

      # ── 5. Build PDF ──────────────────────────────────────────────────────────
      - name: Install Asciidoctor PDF
        run: sudo gem install asciidoctor-pdf --no-document

      - name: Build PDF
        run: |
          asciidoctor-pdf \
            --destination-dir dist/docs \
            --out-file udal-arc42.pdf \
            docs/arc42/arc42.adoc

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: udal-arc42-pdf
          path: dist/docs/udal-arc42.pdf
          retention-days: 30

      # ── 5. Attach to GitHub Release on version tags ───────────────────────────
      - name: Attach PDF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/docs/udal-arc42.pdf
