name: Docs

on:
  push:
    branches: [main]
    # paths filter does not apply to tag pushes, so the PDF is always built
    # on a version tag regardless of which files changed.
    tags:
      - "v*.*.*"
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build arc42 PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload to a release

    steps:
      - uses: actions/checkout@v4

      - name: Install Asciidoctor PDF
        run: sudo gem install asciidoctor-pdf --no-document

      - name: Build PDF
        run: |
          asciidoctor-pdf \
            --destination-dir dist/docs \
            --out-file udal-arc42.pdf \
            docs/arc42/arc42.adoc

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: udal-arc42-pdf
          path: dist/docs/udal-arc42.pdf
          retention-days: 30

      # Attach to GitHub Release when triggered by a version tag
      - name: Attach PDF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/docs/udal-arc42.pdf
