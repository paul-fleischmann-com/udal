name: CI — Go

# Wiederverwendbarer Workflow (workflow_call), aufgerufen vom Orchestrator ci.yml (#208).
on:
  workflow_call:

jobs:
  go-build-test:
    name: Go — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Build gateway + CLI
        run: go build ./code/gateway/... ./code/cli/...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./code/gateway/... ./code/cli/...

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: coverage.out

  go-lint:
    name: Go — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@v9
        with:
          # "latest" keeps the golangci-lint binary in sync with the Go
          # toolchain version used by the runner. Pinning a specific v2.x
          # release would require manual bumps whenever the go directive in
          # any go.mod exceeds the version golangci-lint was built with
          # (e.g. v2.12.2 built with go1.26 rejects go1.27.x modules).
          version: "latest"
          args: --timeout=5m ./code/gateway/... ./code/cli/...

  go-security:
    name: Go — Security (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./code/gateway/... ./code/cli/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (gateway)
        run: govulncheck ./...
        working-directory: code/gateway

      - name: Run govulncheck (cli)
        run: govulncheck ./...
        working-directory: code/cli

  # `goreleaser release --clean` on a real tag push (.github/workflows/release.yml)
  # is the only thing that ever exercises .goreleaser.yaml -- untested until the
  # first actual release tag, at which point a config mistake blocks the release
  # itself. `--snapshot` runs the same build/archive/SBOM/changelog pipeline
  # without needing a tag or publishing anything, so this job catches config
  # breakage (e.g. a builds/archives field GoReleaser no longer recognizes) on
  # every relevant PR instead.
  release-dry-run:
    name: Release — GoReleaser snapshot dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GoReleaser reads full tag/commit history for the changelog pipe

      - uses: ./.github/actions/setup-go

      - name: Install syft (CycloneDX SBOM generation)
        uses: ./.github/actions/install-syft

      - name: Install asciidoctor-pdf and generate demo-setup.pdf (#168)
        run: |
          sudo gem install asciidoctor-pdf --no-document
          asciidoctor-pdf examples/beaglebone/demo-setup.adoc \
            -o examples/beaglebone/demo-setup.pdf

      - name: GoReleaser snapshot dry-run
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned to the same version as release.yml -- see that file's
          # comment on why "latest" isn't used.
          version: "v2.17.1"
          args: release --snapshot --clean

  go-integration:
    name: Go — Integration Tests (MQTT)
    needs: [go-build-test]
    runs-on: ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -h localhost -t test -C 1 --quiet &"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Run integration tests
        run: go test -v -tags integration -timeout 120s ./code/gateway/... ./code/cli/...
        env:
          UDAL_TEST_MQTT_BROKER: tcp://localhost:1883

  # Issue #25 AC: "Tested against virtual CAN (vcan0) in CI". vcan0 is a kernel
  # netdev, not a network service, so it can't reuse go-integration's Docker
  # `services:` pattern above — it's set up as a runner step instead, which
  # works because ubuntu-latest runs on a real Linux kernel (req42.adoc TC-01:
  # SocketCAN is Linux-only in the first place).
  go-integration-can:
    name: Go — Integration Tests (CAN)
    needs: [go-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Set up vcan0
        run: |
          # The vcan module ships in linux-modules-extra-<kernel>, not the
          # base ubuntu-latest runner image -- modprobe fails with "Module
          # vcan not found" without it first.
          sudo apt-get update
          # Paketname je nach Runner-Kernel nicht immer verfuegbar (z.B. azure-Kernel
          # 7.x) -> nicht hart abbrechen, vcan kann bereits im Kernel enthalten sein.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || sudo apt-get install -y linux-modules-extra-azure \
            || echo "::warning::linux-modules-extra nicht installierbar, versuche modprobe direkt"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

      - name: Run integration tests
        run: go test -v -tags integration -timeout 120s ./code/gateway/internal/adapters/can/...
        env:
          UDAL_TEST_CAN_INTERFACE: vcan0
